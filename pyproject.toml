[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "esif-forecasting"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26", "pandas>=2.2", "pyarrow>=16", "scikit-learn>=1.4",
    "matplotlib>=3.8", "PyYAML>=6", "threadpoolctl>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
